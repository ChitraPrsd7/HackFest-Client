<div class="esewa-auth-wrap">

  <!-- LEFT PANEL — Green eSewa branding -->
  <div class="esewa-left-panel">
    <div class="esewa-left-inner">

      <!-- eSewa Logo -->
      <div class="esewa-logo">
        <img src="assets/esewa.png" alt="eSewa Logo" class="esewa-logo-img" style="height: 48px; object-fit: contain;">
      </div>

      <!-- Tagline -->
      <div class="esewa-tagline">
        <h2>Simple &amp; Fast<br>Payment</h2>
        <p>Way to recharge your mobile &amp;<br>make utility bill payments<br>instantly via eSewa.</p>
      </div>

      <!-- Decorative dots -->
      <div class="esewa-dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>

  <!-- RIGHT PANEL — Login Form -->
  <div class="esewa-right-panel">
    <div class="esewa-form-wrap">

      <div class="esewa-form-header">
        <h1>Welcome Back!</h1>
        <p>Login to your eSewa account</p>
      </div>

      <!-- Error Alert -->
      <div class="esewa-alert" *ngIf="loginError">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        {{ loginError }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

        <!-- Mobile Number -->
        <div class="esewa-field" [class.has-error]="mobileNumber.invalid && mobileNumber.touched">
          <label for="mobileNumber">eSewa ID / Mobile Number</label>
          <div class="esewa-input-wrap">
            <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 8.81a19.79 19.79 0 01-3.07-8.6A2 2 0 012 0h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 14z"></path>
            </svg>
            <input
              id="mobileNumber"
              type="tel"
              formControlName="mobileNumber"
              placeholder="98########"
            />
          </div>
          <span class="esewa-field-error" *ngIf="mobileNumber.invalid && mobileNumber.touched">
            Please enter a valid mobile number
          </span>
        </div>

        <!-- Password -->
        <div class="esewa-field" [class.has-error]="password.invalid && password.touched">
          <label for="password">Password / MPIN</label>
          <div class="esewa-input-wrap">
            <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0110 0v4"></path>
            </svg>
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="Enter your password"
            />
            <button type="button" class="toggle-pw" (click)="togglePassword()">
              <svg *ngIf="!showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <span class="esewa-field-error" *ngIf="password.invalid && password.touched">
            Password is required (min 4 characters)
          </span>
        </div>

        <!-- Forgot Password -->
        <div class="esewa-form-options">
          <a href="#" class="esewa-forgot">Forgot Password?</a>
        </div>

        <!-- Submit -->
        <button type="submit" class="esewa-btn-login" [disabled]="isLoading" id="btn-esewa-login">
          <span class="esewa-spinner" *ngIf="isLoading"></span>
          <span *ngIf="!isLoading">Login</span>
          <span *ngIf="isLoading">Verifying...</span>
        </button>

      </form>

      <!-- OR Divider -->
      <div class="esewa-divider">
        <span class="esewa-divider-line"></span>
        <span class="esewa-divider-text">वा / OR</span>
        <span class="esewa-divider-line"></span>
      </div>

      <!-- 1ID Nepal Login Button -->
      <button type="button" class="esewa-btn-oneid" (click)="loginWith1ID()" id="btn-oneid-nepal">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="18" height="18" rx="4" fill="#dc2626"/>
          <text x="12" y="16" text-anchor="middle" fill="white" font-size="10" font-weight="900" font-family="Inter, sans-serif">1ID</text>
        </svg>
        <span class="oneid-label">
          <span class="oneid-main">Login with 1ID Nepal</span>
          <span class="oneid-sub">राष्ट्रिय डिजिटल पहिचान</span>
        </span>
        <svg class="oneid-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>

      <div class="esewa-form-footer">
        <span>Don't have an account?</span>
        <button type="button" class="esewa-register-link" (click)="goToRegister()">
          Create eSewa Account
        </button>
      </div>
    </div>
  </div>

</div>
